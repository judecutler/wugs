# Scrolls: the corpus kit. Design: docs/design/SCROLLS.md. Same project, same
# data as Tongues; switching kits changes which tools open and how they sit.

[kit]
id = "org.wugs.scrolls"
name = "Scrolls"
subtitle = "Corpus"
version = "0.0.1"
description = "Corpus work: every occurrence in context, searches, glossing and the vocabulary of your texts."
offline_core = true

[tools]                            # panels this kit offers; Conflicts, Devices and Kits are always offered.
enabled = [
  "texts",                         # the documents of the corpus
  "concordance",                   # keyword in context, sortable by either side
  "search",
  "gloss",                         # morph analysis of one sentence
  "lexicon",                       # the corpus vocabulary
  "transcribe",                    # read and correct the text sentence by sentence
]

[layout]
panels = [
  { panel = "concordance" },
  { panel = "texts", place = "left", of = "concordance", width = 260 },
  { panel = "search", place = "right", of = "concordance", width = 340 },
  { panel = "lexicon", place = "tab", of = "search" },
  { panel = "transcribe", place = "below", of = "concordance", height = 280 },
  { panel = "gloss", place = "right", of = "transcribe", width = 460 },
]
active = ["texts", "concordance"]

[wug]
body = "#7aa6d8"                   # ink blue, after old manuscripts
accessories = ["glasses", "scroll"]
