name: Release

# Tag v* -> draft GitHub release with the installers attached.
# Manual run, or a PR that changes packaging -> installers as workflow
# artifacts, no release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/Info.plist

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: wugs ${{ github.ref_name }}
          releaseBody: Unsigned alpha build. See docs/INSTALL.md for the SmartScreen and Gatekeeper steps.
          releaseDraft: true
          prerelease: false

      - name: Upload installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: wugs-installers-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
