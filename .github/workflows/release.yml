name: Release

# Tag v* -> draft GitHub release with signed installers, their updater
# signatures and latest.json (the in-app updater's manifest). Only that job
# uses the `release` environment (owner approval, v* tags only) and its
# signing secrets. A manual run, or a PR that changes packaging, builds
# unsigned installers as workflow artifacts with no updater artifacts, so it
# needs no key.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/desktop-setup/action.yml
      - .github/scripts/updater_manifest.py
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.unsigned.conf.json
      - apps/desktop/src-tauri/Info.plist

permissions: {}

jobs:
  installers:
    if: github.event_name != 'push'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/desktop-setup

      # tauri.conf.json turns updater artifacts on, which needs the private
      # key; this build has none, so the override turns them off.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --config ${{ github.workspace }}/apps/desktop/src-tauri/tauri.unsigned.conf.json
          includeUpdaterJson: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wugs-installers-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/desktop-setup

      # The annotated tag's message becomes the release notes and the app's
      # "What's new" (latest.json's notes).
      - name: Release notes from the tag message
        id: notes
        shell: bash
        run: |
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          {
            echo 'body<<WUGS_NOTES_END'
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo 'Installers are not code-signed yet (updates are). See docs/INSTALL.md for the SmartScreen and Gatekeeper steps.'
            echo 'WUGS_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and attach to the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: wugs ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Written once by the manifest job below, not merged by three legs.
          includeUpdaterJson: false

      - name: Keep the notes for the manifest job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  manifest:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Write latest.json to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I .github/scripts/updater_manifest.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md" apps/desktop/src-tauri/tauri.conf.json
