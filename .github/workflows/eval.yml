name: Evaluate models

# Scores every catalogued phone-transcription model, run the way wugs runs
# it, on PRiSM's multilingual phone recognition test sets (roadmap 52,
# docs/design/PACKAGES.md §3), with PRiSM's own scorer: PFER and PER per
# set, plus speed and memory. On demand, and on PRs that touch it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/eval.yml"
      - "crates/wugs-asr/src/bin/**"
      - "scripts/eval/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # PRiSM's repository at the commit whose scorer and set layout were read.
  PRISM_COMMIT: 85094ff9d05955932b99b8697dd582f66136472c
  # How many utterances per set (all of them when empty).
  LIMIT: "20"

jobs:
  phones:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python packages (PRiSM's scorer needs lightning and hydra for its utils)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install huggingface_hub panphon tqdm rich lightning hydra-core rootutils "git+https://github.com/changelinglab/phone-inventory-metric@v0.2.5"
      - name: Find PRiSM's phone recognition sets
        run: python3 -I scripts/eval/prism_sets.py "$RUNNER_TEMP/sets"
      - name: Download the catalogued phone models
        run: python3 -I scripts/eval/fetch_models.py catalog "$RUNNER_TEMP/models"
      - run: cargo build --release -p wugs-asr --bin wugs-asr-eval
      - name: Transcribe every set with every model
        run: python3 -I scripts/eval/run.py "$RUNNER_TEMP/models" "$RUNNER_TEMP/sets" "$RUNNER_TEMP/out" ${LIMIT:+--limit $LIMIT}
      - name: Score with PRiSM's scorer
        run: |
          git clone -q https://github.com/changelinglab/prism "$RUNNER_TEMP/prism"
          git -C "$RUNNER_TEMP/prism" checkout -q "$PRISM_COMMIT"
          python3 -I scripts/eval/score.py "$RUNNER_TEMP/prism" "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/out/summary.md"
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: phone-evaluation
          path: ${{ runner.temp }}/out
