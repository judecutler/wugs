name: help

on:
  push:
    branches: [main]
    paths: ["services/help/**", ".github/workflows/help.yml"]
  workflow_dispatch:
    inputs:
      report:
        description: Print the most-asked report instead of deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: help-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !inputs.report }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: services/help
      - name: Deploy
        working-directory: services/help
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "## Help bot deployed"
            echo
            echo "Address: \`${url:-see the log above}\`"
            echo
            echo "In \`apps/desktop/src-tauri/src/help.rs\`: \`pub const ENDPOINT: &str = \"${url}\";\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    if: ${{ inputs.report }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: services/help
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/most-asked.mjs 30 >> "$GITHUB_STEP_SUMMARY"
