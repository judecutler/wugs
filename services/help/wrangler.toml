# The wugs help bot. Setup, deploy and the "most asked" report: README.md beside this file.
name = "wugs-help"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Any Workers AI text-generation model. GLM-4.7-Flash: about 30 neurons a question, ~300 a day free.
MODEL = "@cf/zai-org/glm-4.7-flash"
# GLM thinks before answering unless told not to; off, a question costs ~30 neurons.
NO_THINKING = "true"
# At most this many questions a day in all (UTC), counted by BUDGET: the
# free 10,000 neurons cover roughly 300.
DAILY_QUESTIONS = "250"
# Where the user guide is read from; {ref} is the asker's version tag, else main.
GUIDE_URL = "https://raw.githubusercontent.com/judecutler/wugs/{ref}/docs/USER-GUIDE.md"

[ai]
binding = "AI"

# Questions people agreed to share, for the "most asked" report.
[[analytics_engine_datasets]]
binding = "ASKED"
dataset = "wugs_help_asked"

# Per address: at most 10 questions a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "4742"

  [ratelimits.simple]
  limit = 10
  period = 60

[observability]
enabled = true

# Everyone together, per Cloudflare location (the limiter is local): at most 20 a
# minute. BUDGET below is the cap that holds worldwide.
[[ratelimits]]
name = "EVERYONE"
namespace_id = "4743"

  [ratelimits.simple]
  limit = 20
  period = 60

# Today's question count (one object per UTC day).
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]
